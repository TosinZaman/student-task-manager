<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Student Task Manager</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
 
  <header class="navbar">
    <div class="logo">Student Task Manager</div>
    <nav class="nav-links">
      <a href="index.html" class="btn btn-login">Home</a>
      <a href="register.html" class="btn btn-register">Register</a>
    </nav>
  </header>
 
  <section class="auth-section">
    <div class="auth-card">
      <h1>Login</h1>
      <p class="auth-subtitle">Welcome back! Please enter your details.</p>
 
      <div id="error-message" class="form-message error-message" hidden></div>
      <div id="success-message" class="form-message success-message" hidden></div>
 
      <form id="login-form" action="#" method="POST" novalidate>
        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            required
            autocomplete="email"
          >
        </div>
 
        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            required
            autocomplete="current-password"
          >
        </div>
 
        <button type="submit" id="login-btn" class="btn btn-primary">Login</button>
      </form>
 
      <p class="auth-footer-text">
        Don't have an account? <a href="register.html">Register here</a>
      </p>
      <p class="auth-footer-text">
        <a href="index.html">Back to Home</a>
      </p>
    </div>
  </section>
 
  <footer class="footer">
    <p>&copy; 2026 Student Task Manager. Made for students, by a student.</p>
    <p>Design & Devoloped by Tosin</p>
  </footer>
 
  <script src="js/auth.js"></script>
</body>
</html>
