<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Student Task Manager</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
 
  <header class="navbar">
    <div class="logo">Student Task Manager</div>
    <nav class="nav-links">
      <a href="index.html" class="btn btn-login">Home</a>
      <a href="login.html" class="btn btn-register">Login</a>
    </nav>
  </header>
 
  <section class="auth-section">
    <div class="auth-card">
      <h1>Create Account</h1>
      <p class="auth-subtitle">Sign up to start organizing your tasks.</p>
 
      <div id="error-message" class="form-message error-message" hidden></div>
      <div id="success-message" class="form-message success-message" hidden></div>
 
      <form id="register-form" action="#" method="POST" novalidate>
        <div class="form-group">
          <label for="fullname">Full Name</label>
          <input
            type="text"
            id="fullname"
            name="fullname"
            placeholder="Enter your full name"
            required
            autocomplete="name"
          >
        </div>
 
        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            required
            autocomplete="email"
          >
        </div>
 
        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Create a password"
            required
            autocomplete="new-password"
          >
        </div>
 
        <div class="form-group">
          <label for="confirm-password">Confirm Password</label>
          <input
            type="password"
            id="confirm-password"
            name="confirm-password"
            placeholder="Re-enter your password"
            required
            autocomplete="new-password"
          >
        </div>
 
        <button type="submit" id="register-btn" class="btn btn-primary">Create Account</button>
      </form>
 
      <p class="auth-footer-text">
        Already have an account? <a href="login.html">Login here</a>
      </p>
      <p class="auth-footer-text">
        <a href="index.html">Back to Home</a>
      </p>
    </div>
  </section>
 
  <footer class="footer">
    <p>&copy; 2026 Student Task Manager. Made for students, by a student.</p>
  </footer>
 
  <script src="js/auth.js"></script>
</body>
</html>
